name = "fixture"
source = "cloncurry"
crs = "EPSG:28354"
root = "."
petrophysics = "cloncurry_petro_tiny.csv"
metals = "cloncurry_metal_tiny.csv"

[bounds]
x = [1000.0, 1040.0]
y = [2000.0, 2040.0]
z = [-50.0, 0.0]

[properties.cu]
column = "Cu_Concentration"
kind = "continuous"
transform = "log10"
lod_policy = "percentile"
percentile = 1.0
unit = "ppm"

[properties.density]
column = "density_mean_g_cm3"
kind = "continuous"
transform = "identity"
unit = "g/cm3"

[properties.susceptibility]
column = "susceptibility_mean_SI"
kind = "continuous"
transform = "log10"
lod_policy = "min_positive"
unit = "SI"

[properties.conductivity]
column = "conductivity_mean_S_m_100kHz"
kind = "continuous"
transform = "log10"
lod_policy = "percentile"
percentile = 1.0
unit = "S/m"

[properties.lithology]
column = "lithology_code"
kind = "categorical"
transform = "identity"
unit = ""

[covariates]
use = ["coordinates", "depth", "structure_distance", "surface_geology"]

[covariates.depth]
rho_ref = 100.0
period_max = 1000.0
d0 = 5.0

[covariates.structure_distance]
file = "cloncurry_structures_tiny.geojson"
length_scale = 10.0

[covariates.surface_geology]
file = "cloncurry_surface_geology_tiny.geojson"
