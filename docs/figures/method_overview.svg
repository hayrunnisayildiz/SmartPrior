<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SmartPrior method overview: data preparation, neural field, and hole-grouped cross-validation</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 700; fill: #1f2328; }
      .s  { font-size: 13px; fill: #3d444d; }
      .lane { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; }
      .ln { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">How the Keivitsa result is produced</text>

  <!-- lane backgrounds -->
  <rect x="16" y="58"  width="1168" height="160" rx="10" fill="#f1f6fd"/>
  <rect x="16" y="244" width="1168" height="160" rx="10" fill="#fdf2f3"/>
  <rect x="16" y="430" width="1168" height="210" rx="10" fill="#eff8f2"/>
  <text class="lane" x="34" y="84"  fill="#2f5f9e">1 · DATA</text>
  <text class="lane" x="34" y="270" fill="#a8323e">2 · MODEL</text>
  <text class="lane" x="34" y="456" fill="#2b6e45">3 · EVALUATION</text>

  <!-- lane 1 -->
  <g stroke="#2f5f9e" stroke-width="1.4" fill="#ffffff">
    <rect x="34"  y="96" width="250" height="104" rx="8"/>
    <rect x="324" y="96" width="250" height="104" rx="8"/>
    <rect x="614" y="96" width="250" height="104" rx="8"/>
    <rect x="904" y="96" width="262" height="104" rx="8"/>
  </g>
  <text class="t" x="159" y="126" text-anchor="middle">GTK drillhole tables</text>
  <text class="s" x="159" y="150" text-anchor="middle">collars · survey stations</text>
  <text class="s" x="159" y="170" text-anchor="middle">Cu assays (511P) · petrophysics</text>
  <text class="s" x="159" y="190" text-anchor="middle">kept outside the repository</text>

  <text class="t" x="449" y="126" text-anchor="middle">Minimum-curvature desurvey</text>
  <text class="s" x="449" y="150" text-anchor="middle">each sample is placed at its</text>
  <text class="s" x="449" y="170" text-anchor="middle">along-hole depth in 3D</text>

  <text class="t" x="739" y="126" text-anchor="middle">SampleTable</text>
  <text class="s" x="739" y="150" text-anchor="middle">15,859 Cu samples · 261 holes</text>
  <text class="s" x="739" y="170" text-anchor="middle">Cu below 1 ppm kept as a</text>
  <text class="s" x="739" y="190" text-anchor="middle">censored upper bound</text>

  <text class="t" x="1035" y="126" text-anchor="middle">Covariates</text>
  <text class="s" x="1035" y="150" text-anchor="middle">known at every point:</text>
  <text class="s" x="1035" y="170" text-anchor="middle">x, y, z scaled to [−1, 1]</text>
  <text class="s" x="1035" y="190" text-anchor="middle">depth below collar surface</text>

  <path class="ln" d="M284,148 L322,148"/>
  <path class="ln" d="M574,148 L612,148"/>
  <path class="ln" d="M864,148 L902,148"/>

  <!-- lane 1 -> lane 2 -->
  <path class="ln" d="M1035,200 L1035,226 L159,226 L159,280"/>

  <!-- lane 2 -->
  <g stroke="#a8323e" stroke-width="1.4" fill="#ffffff">
    <rect x="34"  y="282" width="250" height="104" rx="8"/>
    <rect x="324" y="282" width="250" height="104" rx="8"/>
    <rect x="614" y="282" width="250" height="104" rx="8"/>
    <rect x="904" y="282" width="262" height="104" rx="8"/>
  </g>
  <text class="t" x="159" y="312" text-anchor="middle">Fourier features</text>
  <text class="s" x="159" y="336" text-anchor="middle">sin and cos of x, y, z at</text>
  <text class="s" x="159" y="356" text-anchor="middle">16 scales (1–16) per axis</text>
  <text class="s" x="159" y="376" text-anchor="middle">99 inputs (100 with depth)</text>

  <text class="t" x="449" y="312" text-anchor="middle">Lux MLP</text>
  <text class="s" x="449" y="336" text-anchor="middle">3 layers × 64 units, GELU</text>
  <text class="s" x="449" y="356" text-anchor="middle">outputs mean μ and spread σ</text>
  <text class="s" x="449" y="376" text-anchor="middle">loss: Gaussian NLL</text>

  <text class="t" x="739" y="312" text-anchor="middle">Deep ensemble × 5</text>
  <text class="s" x="739" y="336" text-anchor="middle">five independent seeds</text>
  <text class="s" x="739" y="356" text-anchor="middle">σ² = mean(σₖ²) + var(μₖ)</text>
  <text class="s" x="739" y="376" text-anchor="middle">(noise + model disagreement)</text>

  <text class="t" x="1035" y="312" text-anchor="middle">Block model</text>
  <text class="s" x="1035" y="336" text-anchor="middle">μ and σ of log10 Cu</text>
  <text class="s" x="1035" y="356" text-anchor="middle">for every block within</text>
  <text class="s" x="1035" y="376" text-anchor="middle">60 m of a drillhole</text>

  <path class="ln" d="M284,334 L322,334"/>
  <path class="ln" d="M574,334 L612,334"/>
  <path class="ln" d="M864,334 L902,334"/>

  <!-- lane 2 -> lane 3 -->
  <path class="ln" d="M739,386 L739,466"/>

  <!-- lane 3 -->
  <g stroke="#2b6e45" stroke-width="1.4" fill="#ffffff">
    <rect x="34"  y="468" width="540" height="152" rx="8"/>
    <rect x="614" y="468" width="250" height="152" rx="8"/>
    <rect x="904" y="468" width="262" height="152" rx="8"/>
  </g>
  <text class="t" x="54" y="498">10-fold hole-grouped cross-validation</text>
  <text class="s" x="54" y="524">Whole drillholes are held out. A test hole never enters training,</text>
  <text class="s" x="54" y="544">target standardisation, variogram fitting, or early stopping.</text>
  <text class="s" x="54" y="570">Inside each training set, 20 % of the holes are a validation set:</text>
  <text class="s" x="54" y="590">training stops when validation RMSE of μ stops improving.</text>
  <!-- fold strip -->
  <g>
    <rect x="360" y="484" width="18" height="12" fill="#2b6e45"/>
    <rect x="380" y="484" width="18" height="12" fill="#b9dcc6"/>
    <rect x="400" y="484" width="18" height="12" fill="#b9dcc6"/>
    <rect x="420" y="484" width="18" height="12" fill="#b9dcc6"/>
    <rect x="440" y="484" width="18" height="12" fill="#b9dcc6"/>
    <rect x="460" y="484" width="18" height="12" fill="#b9dcc6"/>
    <rect x="480" y="484" width="18" height="12" fill="#b9dcc6"/>
    <rect x="500" y="484" width="18" height="12" fill="#b9dcc6"/>
    <rect x="520" y="484" width="18" height="12" fill="#b9dcc6"/>
    <rect x="540" y="484" width="18" height="12" fill="#b9dcc6"/>
  </g>
  <rect x="360" y="502" width="12" height="10" fill="#2b6e45"/>
  <text class="s" x="377" y="511" font-size="11">test fold</text>
  <rect x="440" y="502" width="12" height="10" fill="#b9dcc6"/>
  <text class="s" x="457" y="511" font-size="11">training folds</text>

  <text class="t" x="739" y="498" text-anchor="middle">Compared methods</text>
  <text class="s" x="739" y="524" text-anchor="middle">mean (training average)</text>
  <text class="s" x="739" y="546" text-anchor="middle">kriging (v1), ordinary</text>
  <text class="s" x="739" y="568" text-anchor="middle">nn_xyz: coordinates only</text>
  <text class="s" x="739" y="590" text-anchor="middle">nn_cov: coordinates + depth</text>

  <text class="t" x="1035" y="498" text-anchor="middle">Scores</text>
  <text class="s" x="1035" y="524" text-anchor="middle">skill = 1 − RMSE / RMSE_mean</text>
  <text class="s" x="1035" y="546" text-anchor="middle">(0 = no better than the mean)</text>
  <text class="s" x="1035" y="568" text-anchor="middle">90 % interval coverage</text>
  <text class="s" x="1035" y="590" text-anchor="middle">(ideal: 0.90)</text>

  <path class="ln" d="M574,544 L612,544"/>
  <path class="ln" d="M864,544 L902,544"/>
</svg>
