<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SmartPrior in three steps: prepare the drillhole data, train the model, test it on held-out drillholes</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .t  { font-size: 17px; font-weight: 700; fill: #1f2328; }
      .s  { font-size: 14px; fill: #3d444d; }
      .lane { font-size: 14px; font-weight: 700; letter-spacing: 0.06em; }
      .ln { stroke: #57606a; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="440" fill="#ffffff"/>

  <rect x="16" y="16"  width="1168" height="124" rx="10" fill="#f1f6fd"/>
  <rect x="16" y="158" width="1168" height="124" rx="10" fill="#fdf2f3"/>
  <rect x="16" y="300" width="1168" height="124" rx="10" fill="#eff8f2"/>
  <text class="lane" x="34" y="40"  fill="#2f5f9e">1 · PREPARE DATA</text>
  <text class="lane" x="34" y="182" fill="#a8323e">2 · TRAIN MODEL</text>
  <text class="lane" x="34" y="324" fill="#2b6e45">3 · TEST</text>

  <!-- lane 1 -->
  <g stroke="#2f5f9e" stroke-width="1.4" fill="#ffffff">
    <rect x="34"  y="52" width="250" height="72" rx="8"/>
    <rect x="324" y="52" width="250" height="72" rx="8"/>
    <rect x="614" y="52" width="250" height="72" rx="8"/>
    <rect x="904" y="52" width="262" height="72" rx="8"/>
  </g>
  <text class="t" x="159" y="82"  text-anchor="middle">GTK drillholes</text>
  <text class="s" x="159" y="106" text-anchor="middle">collars, surveys, Cu assays</text>
  <text class="t" x="449" y="82"  text-anchor="middle">Desurvey</text>
  <text class="s" x="449" y="106" text-anchor="middle">each sample gets an x, y, z</text>
  <text class="t" x="739" y="82"  text-anchor="middle">Sample table</text>
  <text class="s" x="739" y="106" text-anchor="middle">15,859 Cu samples, 261 holes</text>
  <text class="t" x="1035" y="82" text-anchor="middle">Inputs</text>
  <text class="s" x="1035" y="106" text-anchor="middle">position and depth</text>
  <path class="ln" d="M284,88 L322,88"/>
  <path class="ln" d="M574,88 L612,88"/>
  <path class="ln" d="M864,88 L902,88"/>
  <path class="ln" d="M1035,124 L1035,148 L230,148 L230,192"/>

  <!-- lane 2 -->
  <g stroke="#a8323e" stroke-width="1.4" fill="#ffffff">
    <rect x="34"  y="194" width="250" height="72" rx="8"/>
    <rect x="324" y="194" width="250" height="72" rx="8"/>
    <rect x="614" y="194" width="250" height="72" rx="8"/>
    <rect x="904" y="194" width="262" height="72" rx="8"/>
  </g>
  <text class="t" x="159" y="224" text-anchor="middle">Fourier features</text>
  <text class="s" x="159" y="248" text-anchor="middle">lets the net learn fine detail</text>
  <text class="t" x="449" y="224" text-anchor="middle">Neural network</text>
  <text class="s" x="449" y="248" text-anchor="middle">outputs a value and its σ</text>
  <text class="t" x="739" y="224" text-anchor="middle">5 networks</text>
  <text class="s" x="739" y="248" text-anchor="middle">disagreement adds to σ</text>
  <text class="t" x="1035" y="224" text-anchor="middle">3D block model</text>
  <text class="s" x="1035" y="248" text-anchor="middle">grade and σ per block</text>
  <path class="ln" d="M284,230 L322,230"/>
  <path class="ln" d="M574,230 L612,230"/>
  <path class="ln" d="M864,230 L902,230"/>
  <path class="ln" d="M739,266 L739,334"/>

  <!-- lane 3 -->
  <g stroke="#2b6e45" stroke-width="1.4" fill="#ffffff">
    <rect x="34"  y="336" width="540" height="72" rx="8"/>
    <rect x="614" y="336" width="250" height="72" rx="8"/>
    <rect x="904" y="336" width="262" height="72" rx="8"/>
  </g>
  <text class="t" x="304" y="366" text-anchor="middle">Hold out whole drillholes (10 folds)</text>
  <text class="s" x="304" y="390" text-anchor="middle">a test hole is never seen during training</text>
  <text class="t" x="739" y="366" text-anchor="middle">Compare</text>
  <text class="s" x="739" y="390" text-anchor="middle">average · kriging · network</text>
  <text class="t" x="1035" y="366" text-anchor="middle">Score</text>
  <text class="s" x="1035" y="390" text-anchor="middle">skill and 90 % coverage</text>
  <path class="ln" d="M574,372 L612,372"/>
  <path class="ln" d="M864,372 L902,372"/>
</svg>
