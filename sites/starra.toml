# Starra, Cloncurry district (METAL / GDA94 MGA zone 54).
# Bounds are cloncurry_deposit_bounds(samples, "Starra") on
# Cloncurry_integrated_2026-09-17, with that function's default pads
# (50 m in x/y, 25 m in z). They frame the covariates; they do not drop rows.

name = "starra"
source = "cloncurry"
crs = "EPSG:28354"
deposit = "Starra"

[bounds]
x = [445510, 446307.53075122001]
y = [7602777, 7604824]
z = [-172.11871003483, 477]

# Continuous values are stored in the original unit. transform is metadata
# for a later training step. "<LOD" and conductivity zeros are upper bounds.
# percentile is in percent (1 = the 1st percentile of positive measurements,
# Statistics.quantile type 7). Susceptibility ≤ 0 uses the smallest positive
# value, not a percentile.

[properties.cu]
column = "Cu_Concentration"
kind = "continuous"
transform = "log10"
lod_policy = "percentile"
percentile = 1.0
unit = "ppm"

[properties.density]
column = "density_mean_g_cm3"
kind = "continuous"
transform = "identity"
unit = "g/cm3"

[properties.susceptibility]
column = "susceptibility_mean_SI"
kind = "continuous"
transform = "log10"
lod_policy = "min_positive"
unit = "SI"

[properties.conductivity]
column = "conductivity_mean_S_m_100kHz"
kind = "continuous"
transform = "log10"
lod_policy = "percentile"
percentile = 1.0
unit = "S/m"

# Drillhole lithology is a future output, not a covariate. The raw code is
# stored; rare classes are not collapsed to OTHER here.
[properties.lithology]
column = "lithology_code"
kind = "categorical"
transform = "identity"
unit = ""

# pXRF and sample_distance are intentionally absent.
# depth.d0 = 25 m is half of the 50 m vertical cell used by the Ernest Henry
# hold-out script. structure length_scale = 100 m is that script's horizontal
# cell (h_median on a uniform mesh). cloncurry_grid rounds the cell thickness
# to fit the box, so these are the reference scales, not a mesh definition.

[covariates]
use = ["coordinates", "depth", "structure_distance", "surface_geology"]

[covariates.depth]
rho_ref = 100.0
period_max = 1000.0
d0 = 25.0

[covariates.structure_distance]
file = "geology/structures.geojson"
length_scale = 100.0

[covariates.surface_geology]
file = "geology/surface_geology.geojson"

